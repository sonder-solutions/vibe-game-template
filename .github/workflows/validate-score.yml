name: Validate Score Submission

on:
  issues:
    types: [opened, edited]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Build decryption binary
        run: |
          cd scripts/decrypt-binary
          cargo build --release

      - name: Extract payload from issue
        id: extract
        run: |
          # Extract encrypted payload from issue body (between ``` markers)
          PAYLOAD=$(echo "${{ github.event.issue.body }}" | sed -n '/```/,/```/p' | sed '1d;$d' | tr -d '\n')
          echo "payload=$PAYLOAD" >> $GITHUB_OUTPUT

      - name: Validate and update leaderboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PAYLOAD="${{ steps.extract.outputs.payload }}"

          if [ -z "$PAYLOAD" ]; then
            echo "No payload found in issue"
            exit 1
          fi

          # Decrypt and validate, update leaderboard
          ./scripts/decrypt-binary/target/release/decrypt-binary "$PAYLOAD"

      - name: Commit updated leaderboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LEADERBOARD.md
          git diff --staged --quiet || git commit -m "chore: update leaderboard with new score"
          git push

      - name: Comment on issue
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ✅ Score validated and added to the leaderboard!

            Check the [leaderboard](./LEADERBOARD.md) to see your ranking.

      - name: Close issue
        if: success()
        uses: peter-evans/close-issue@v3
